<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Pro Scanner & Editor</title>
  <link rel="stylesheet" href="style.css">
  <!-- Required Libraries -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
  <header>
    <h1>📄 PDF Scanner & Editor</h1>
    <div class="toolbar">
      <input type="file" id="pdfUpload" accept="application/pdf">
      <button id="startCamBtn">📸 Open Scanner</button>
      <input type="text" id="customText" placeholder="Text yahan likhein...">
      <button id="addTextBtn">✏️ Add Text</button>
      <button id="downloadBtn" class="primary">📥 Download PDF</button>
    </div>
  </header>

  <main>
    <!-- Scanner View -->
    <div id="scannerSection" class="hidden">
      <video id="video" autoplay playsinline></video>
      <div class="cam-controls">
        <button id="captureBtn">📷 Capture Page</button>
        <button id="closeCamBtn" class="danger">Close Camera</button>
      </div>
    </div>

    <!-- PDF Viewer Canvas -->
    <div id="canvasContainer">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
